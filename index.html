<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>INNOVEX</title>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

        }


        body {

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: "Courier New", monospace;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    #ff1493 0%,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 25%,
                    #00d9ff 0%,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 90%,
                    #8a2be2 0%,
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #12002f,
                    #001b55,
                    #26005c,
                    #001b55
                );

            background-size: 200% 200%;

            animation: backgroundMove 15s ease infinite;

            user-select: none;
            -webkit-user-select: none;

            touch-action: manipulation;

        }


        .screen {

            width: 94%;

            max-width: 1400px;

            text-align: center;

        }


        /* Normal system text */

        .text {

            font-size: clamp(35px, 5vw, 65px);

            font-weight: bold;

            letter-spacing: 5px;

            color: #ffffff;

        }


        /* System login */

        .login {

            font-size: clamp(40px, 5.5vw, 70px);

            font-weight: bold;

            color: #ffffff;

        }


        /* Username and password */

        .input-label {

            font-size: clamp(38px, 5.5vw, 70px);

            font-weight: bold;

            color: #ffffff;

            letter-spacing: 5px;

            margin-bottom: 30px;

        }


        .input-box {

            width: 80%;

            max-width: 900px;

            padding: 15px 20px;

            background: rgba(0, 0, 0, 0.25);

            border: 3px solid #ffffff;

            border-radius: 8px;

            outline: none;

            color: #ffffff;

            font-family: "Courier New", monospace;

            font-size: clamp(30px, 4.5vw, 55px);

            font-weight: bold;

            text-align: center;

            user-select: text;

            -webkit-user-select: text;

        }


        /* Authentication */

        .auth {

            font-size: clamp(40px, 5.5vw, 70px);

            font-weight: bold;

            color: #ffffff;

        }


        /* Access granted */

        .access {

            font-size: clamp(45px, 6vw, 75px);

            font-weight: bold;

            color: #ffffff;

        }


        /* INNOVEX */

        .innovex {

            font-family: Arial, sans-serif;

            font-size: clamp(65px, 10vw, 140px);

            font-weight: 900;

            letter-spacing: clamp(5px, 1vw, 12px);

            color: #ffffff;

        }


        /* Tagline */

        .tagline {

            margin-top: 15px;

            font-family: Arial, sans-serif;

            font-size: clamp(20px, 3.2vw, 45px);

            font-weight: bold;

            letter-spacing: clamp(1px, 0.4vw, 4px);

            color: #00ffff;

        }


        /* 07 October */

        .date {

            font-size: clamp(45px, 6vw, 75px);

            font-weight: bold;

            color: #ffff00;

            letter-spacing: 7px;

        }


        /* Mission */

        .mission {

            font-size: clamp(35px, 5.2vw, 65px);

            font-weight: bold;

            color: #ffff00;

            letter-spacing: 5px;

        }


        /* Are you ready */

        .ready {

            font-size: clamp(38px, 5.5vw, 70px);

            font-weight: bold;

            color: #00ffcc;

            letter-spacing: 5px;

        }


        /* Registrations */

        .registrations {

            font-size: clamp(35px, 5.2vw, 65px);

            font-weight: bold;

            color: #ffffff;

            letter-spacing: 4px;

        }


        /* Screen transition */

        .fade {

            animation: fadeIn 0.6s ease;

        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: scale(0.96);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }

        }


        /* Moving colourful background */

        @keyframes backgroundMove {

            0% {

                background-position: 0% 50%;

            }

            50% {

                background-position: 100% 50%;

            }

            100% {

                background-position: 0% 50%;

            }

        }


        /* Small phones */

        @media (max-width: 500px) {

            .screen {

                width: 92%;

            }


            .text {

                letter-spacing: 2px;

            }


            .input-label {

                letter-spacing: 2px;

                margin-bottom: 20px;

            }


            .input-box {

                width: 90%;

                border-width: 2px;

                border-radius: 6px;

            }


            .tagline {

                margin-top: 8px;

                line-height: 1.3;

            }


            .date {

                letter-spacing: 3px;

            }


            .mission {

                letter-spacing: 2px;

                line-height: 1.3;

            }


            .ready {

                letter-spacing: 2px;

                line-height: 1.3;

            }


            .registrations {

                letter-spacing: 2px;

                line-height: 1.3;

            }

        }

    </style>

</head>


<body>


    <div class="screen">

        <div id="content" class="fade"></div>

    </div>



    <script>


        /*
        ========================================
                 INNOVEX LOGIN SETTINGS
        ========================================
        */

        const CORRECT_USERNAME = "BUILDER";

        const CORRECT_PASSWORD = "INNOVEX";


        /*
        ========================================
                  CURRENT STEP
        ========================================
        */

        let currentStep = 0;


        let usernameInput = "";

        let passwordInput = "";


        const content =
            document.getElementById("content");



        /*
        ========================================
                    SHOW SCREEN
        ========================================
        */

        function showScreen(html) {

            content.classList.remove("fade");


            setTimeout(() => {

                content.innerHTML = html;

                content.classList.add("fade");

            }, 50);

        }



        /*
        ========================================
                    STEP 1
        ========================================
        */

        function step1() {

            showScreen(`

                <div class="text">
                    INITIALIZING...
                </div>

            `);

        }



        /*
        ========================================
                    STEP 2
        ========================================
        */

        function step2() {

            showScreen(`

                <div class="text">
                    SYSTEM ONLINE
                </div>

            `);

        }



        /*
        ========================================
                    STEP 3
        ========================================
        */

        function step3() {

            showScreen(`

                <div class="login">
                    SYSTEM LOGIN
                </div>

            `);

        }



        /*
        ========================================
                    STEP 4
        ========================================
        */

        function step4() {

            showScreen(`

                <div class="input-label">
                    USERNAME:
                </div>

                <input
                    id="username"
                    class="input-box"
                    type="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    autocorrect="off"
                    spellcheck="false"
                >

            `);


            setTimeout(() => {

                document
                    .getElementById("username")
                    .focus();

            }, 150);

        }



        /*
        ========================================
                    STEP 5
        ========================================
        */

        function step5() {

            showScreen(`

                <div class="input-label">
                    PASSWORD:
                </div>

                <input
                    id="password"
                    class="input-box"
                    type="password"
                    autocomplete="off"
                >

            `);


            setTimeout(() => {

                document
                    .getElementById("password")
                    .focus();

            }, 150);

        }



        /*
        ========================================
                    STEP 6
        ========================================
        */

        function step6() {

            showScreen(`

                <div class="auth">
                    AUTHENTICATING...
                </div>

            `);

        }



        /*
        ========================================
                    STEP 7
        ========================================
        */

        function step7() {

            showScreen(`

                <div class="access">
                    ACCESS GRANTED
                </div>

            `);

        }



        /*
        ========================================
                    STEP 8
        ========================================
        */

        function step8() {

            showScreen(`

                <div class="innovex">
                    INNOVEX
                </div>

                <div class="tagline">
                    WHERE AI MEETS IMAGINATION
                </div>

            `);

        }



        /*
        ========================================
                    STEP 9
        ========================================
        */

        function step9() {

            showScreen(`

                <div class="date">
                    07 OCTOBER
                </div>

            `);

        }



        /*
        ========================================
                    STEP 10
        ========================================
        */

        function step10() {

            showScreen(`

                <div class="mission">
                    MISSION: BUILD. SOLVE. INNOVATE.
                </div>

            `);

        }



        /*
        ========================================
                    STEP 11
        ========================================
        */

        function step11() {

            showScreen(`

                <div class="ready">
                    ARE YOU READY TO ENTER?
                </div>

            `);

        }



        /*
        ========================================
                    STEP 12
        ========================================
        */

        function step12() {

            showScreen(`

                <div class="registrations">
                    REGISTRATIONS OPENING SOON
                </div>

            `);

        }



        /*
        ========================================
                 MOVE TO NEXT STEP
        ========================================
        */

        function nextStep() {


            /*
            USERNAME CHECK
            */

            if (currentStep === 3) {

                const input =
                    document.getElementById("username");


                if (!input) {

                    return;

                }


                usernameInput =
                    input.value.trim().toUpperCase();


                if (
                    usernameInput !==
                    CORRECT_USERNAME
                ) {

                    input.value = "";

                    input.focus();

                    return;

                }

            }



            /*
            PASSWORD CHECK
            */

            if (currentStep === 4) {

                const input =
                    document.getElementById("password");


                if (!input) {

                    return;

                }


                passwordInput =
                    input.value;


                if (
                    passwordInput !==
                    CORRECT_PASSWORD
                ) {

                    input.value = "";

                    input.focus();

                    return;

                }

            }



            /*
            Move to next step
            */

            if (currentStep < 11) {

                currentStep++;

            }


            switch (currentStep) {


                case 1:

                    step2();

                    break;


                case 2:

                    step3();

                    break;


                case 3:

                    step4();

                    break;


                case 4:

                    step5();

                    break;


                case 5:

                    step6();

                    break;


                case 6:

                    step7();

                    break;


                case 7:

                    step8();

                    break;


                case 8:

                    step9();

                    break;


                case 9:

                    step10();

                    break;


                case 10:

                    step11();

                    break;


                case 11:

                    step12();

                    break;

            }

        }



        /*
        ========================================
                 LAPTOP: ENTER KEY
        ========================================
        */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    nextStep();

                }

            }
        );



        /*
        ========================================
                 PHONE: TAP SCREEN
        ========================================
        */

        document.addEventListener(
            "click",
            function(event) {


                /*
                Don't advance when
                clicking inside an input.
                */

                if (
                    event.target.tagName === "INPUT"
                ) {

                    return;

                }


                nextStep();

            }
        );



        /*
        ========================================
                 PHONE: TOUCH
        ========================================
        */

        document.addEventListener(
            "touchend",
            function(event) {


                if (
                    event.target.tagName === "INPUT"
                ) {

                    return;

                }


                nextStep();

            }
        );



        /*
        ========================================
                 START INNOVEX
        ========================================
        */

        step1();


    </script>


</body>

</html>
